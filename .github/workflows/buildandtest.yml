name: Build and Test .NET 10.0
permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ master, main, develop/*, release/* ]
  pull_request:
    branches: [ master, main, develop/*, release/* ]
    # Note: do NOT filter on '**.cs' / '**.csproj' here. Dependency updates touch
    # only Directory.Packages.props, so a path filter of source files means every
    # Dependabot PR merges without a single test having run.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: test-${{matrix.os}}-${{matrix.csproj}}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025-vs2026]
        csproj: [UaServer, UaClient, UaConfiguration, UaUtilities]
        include:
          - framework: 'net10.0'
            dotnet-version: '10.0.x'
            configuration: 'Release'
            customtesttarget: net10.0

    env:
      OS: ${{ matrix.os }}
      DOTNET_VERSION: ${{ matrix.dotnet-version }}
      CONFIGURATION:  ${{ matrix.configuration }}
      CSPROJ: ${{ matrix.csproj }}
      CSPROJECT: "./Tests/Technosoftware/${{ matrix.csproj }}.Tests/Technosoftware.${{ matrix.csproj }}.Tests.csproj"
      TESTRESULTS: "TestResults-${{matrix.csproj}}-${{matrix.os}}-${{matrix.framework}}-${{matrix.configuration}}"

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Make the host name resolvable
      if: runner.os != 'Windows'
      shell: bash
      # ServerFixture publishes endpoint URLs built from Utils.GetHostName(). If
      # that name does not resolve, TcpMessageSocket.ConnectAsync fails with
      # SocketException(11) TryAgain and whole client fixtures fail on DNS, not
      # on anything to do with the code under test.
      run: |
        full="$(hostname)"
        short="${full%%.*}"
        echo "127.0.0.1 ${full} ${short}" | sudo tee -a /etc/hosts
        echo "::1 ${full} ${short}" | sudo tee -a /etc/hosts

    - name: Build
      run: dotnet build ${{ env.CSPROJECT }} --framework ${{ matrix.framework }} --configuration ${{ matrix.configuration }} /p:CustomTestTarget=${{ matrix.customtesttarget }}

    - name: Test
      # note: /p:CollectCoverage=true is only used to disable deterministic builds
      run: dotnet test ${{ env.CSPROJECT }} --no-build --framework ${{ matrix.framework }} --logger trx --configuration ${{ matrix.configuration }} /p:CollectCoverage=true /p:CustomTestTarget=${{ matrix.customtesttarget }} --collect:"XPlat Code Coverage" --settings ./Tests/coverlet.runsettings.xml --results-directory ${{ env.TESTRESULTS }}

    - name: Upload test results
      uses: actions/upload-artifact@v7
      with:
        name: dotnet-results-${{matrix.csproj}}-${{matrix.os}}-${{matrix.framework}}-${{matrix.configuration}}
        path: ${{ env.TESTRESULTS }}
        # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}

    # One upload per report type. The previous three consecutive codecov-action
    # steps uploaded the same directory twice and then re-uploaded it with no
    # directory at all.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: technosoftware-gmbh/UaSolutions
        directory: ${{ env.TESTRESULTS }}
        env_vars: CSPROJ,OS,DOTNET_VERSION,CONFIGURATION
        fail_ci_if_error: false
        verbose: true
      if: ${{ always() }}

    - name: Upload test results to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: technosoftware-gmbh/UaSolutions
        directory: ${{ env.TESTRESULTS }}
        report_type: test_results
        fail_ci_if_error: false
      if: ${{ always() }}

  # The samples are the first thing a prospective customer builds. Nothing in CI
  # compiled them before, so a breaking change in the libraries could ship with
  # green checks and a Tutorials.slnx that does not build.
  build-samples:
    name: samples-${{ matrix.os }}-${{ matrix.flavour }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025-vs2026]
        # mit      = a plain build: no licensing dependency, no license check
        # licensed = what the shipped NuGet packages are built with
        flavour: [mit, licensed]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Build the full source solution (all TFMs)
      run: dotnet build UaSolutionsSource.slnx --configuration Release -p:Licensed=${{ matrix.flavour == 'licensed' }}

    - name: Build the tutorials solution
      run: dotnet build Tutorials.slnx --configuration Release -p:Licensed=${{ matrix.flavour == 'licensed' }}

  # The whole single-source design rests on the licensing conditionals staying put:
  # one implementation file each, plus the .csproj that defines the constant. If they
  # spread, the two flavours start to diverge in ways nobody is tracking.
  guard-conditional-compilation:
    name: Guard the licensing conditional
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: TECHNOSOFTWARE_LICENSED must stay in the licensing seam
      shell: bash
      env:
        LC_ALL: C
      run: |
        expected=$(printf '%s\n' \
          'src/Technosoftware/UaConfiguration/ApplicationInstance.cs' \
          'src/Technosoftware/UaConfiguration/Licensing/LicenseHandlerGate.cs' \
          'src/Technosoftware/UaConfiguration/Technosoftware.UaConfiguration.csproj')
        actual=$(grep -rl --include='*.cs' --include='*.csproj' \
          'TECHNOSOFTWARE_LICENSED' src tutorials Tests | sort || true)
        if [ "$actual" != "$expected" ]; then
          echo "::error::TECHNOSOFTWARE_LICENSED belongs in LicenseHandlerGate.cs, the"
          echo "::error::ApplicationInstance hook and the UaConfiguration .csproj only."
          echo "expected:"; printf '%s\n' "$expected"
          echo "actual:";   printf '%s\n' "$actual"
          exit 1
        fi
        echo "OK: $(printf '%s\n' "$actual" | wc -l) expected files."

    - name: LICENSE_TEST_SEAM must stay in the UaUtilities seam
      shell: bash
      env:
        LC_ALL: C
      run: |
        expected=$(printf '%s\n' \
          'src/Technosoftware/UaUtilities/Licensing/LicenseHandler.cs' \
          'src/Technosoftware/UaUtilities/Technosoftware.UaUtilities.csproj')
        actual=$(grep -rl --include='*.cs' --include='*.csproj' \
          'LICENSE_TEST_SEAM' src tutorials Tests | sort || true)
        if [ "$actual" != "$expected" ]; then
          echo "::error::LICENSE_TEST_SEAM belongs in LicenseHandler.cs and the"
          echo "::error::UaUtilities .csproj only. See project doc 13."
          echo "expected:"; printf '%s\n' "$expected"
          echo "actual:";   printf '%s\n' "$actual"
          exit 1
        fi
        echo "OK: $(printf '%s\n' "$actual" | wc -l) expected files."

    - name: A default build must not contain the test seam
      shell: bash
      # The seam is what lets a licence signed with a key other than the production one
      # be accepted. If it ever reaches a shipped assembly, licensing is bypassable.
      run: |
        dotnet build src/Technosoftware/UaUtilities/Technosoftware.UaUtilities.csproj \
          -c Release -p:CustomTestTarget=net10.0 -o "$RUNNER_TEMP/seamcheck"
        if grep -qa 'PublicKeyOverride' "$RUNNER_TEMP/seamcheck/Technosoftware.UaUtilities.dll"; then
          echo "::error::The default build of UaUtilities contains PublicKeyOverride."
          exit 1
        fi
        echo "OK: no test seam in the default build."

    - name: The seam must not leak into a licensed solution build
      shell: bash
      # UaUtilities is built twice in one solution build: the ordinary way for
      # UaConfiguration, and with LicenseTestSeam=true for UaUtilities.Tests. They are
      # kept apart by the seam output paths in Directory.Build.props. If that ever
      # breaks they share obj/ and bin/, the last writer wins, and the seam can reach
      # the assembly that gets packed. Only the seam folder and the test project's own
      # output may carry the symbol.
      run: |
        dotnet build UaSolutionsSource.slnx -c Release -p:Licensed=true -p:CustomTestTarget=net10.0
        leaked=$(grep -rla 'PublicKeyOverride' \
          --include='Technosoftware.UaUtilities.dll' src tutorials Tests \
          | grep -v '/seam/' | grep -v '/UaUtilities.Tests/' || true)
        if [ -n "$leaked" ]; then
          echo "::error::The licence test seam reached a shipped output:"
          printf '%s\n' "$leaked"
          exit 1
        fi
        echo "OK: the seam stayed in its own output folder."
